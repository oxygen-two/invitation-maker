<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#42101f">
  <meta name="description" content="템플릿 기반 초대장 제작 및 HTML 다운로드 도구">
  <title>Invitation Maker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='46'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Serif+Display&family=Gowun+Batang:wght@400;700&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Song+Myung&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-mobile-view="editor">
  <nav class="mobile-view-tabs" aria-label="화면 전환">
    <button type="button" data-mobile-view="editor" aria-pressed="true">제작</button>
    <button type="button" data-mobile-view="preview" aria-pressed="false">미리보기</button>
    <button type="button" data-mobile-view="library" aria-pressed="false">보관함</button>
  </nav>
  <main class="app-shell">
    <section class="maker-panel">
      <header class="maker-header">
        <p class="eyebrow">Invitation Maker</p>
        <h1>초대장 제작기</h1>
        <p>템플릿을 고르고 내용을 입력하면, 독립 실행 가능한 초대장 HTML을 다운로드할 수 있습니다.</p>
      </header>

      <section class="template-picker" aria-label="초대장 템플릿 선택">
        <span class="picker-label">Template</span>
        <div id="template-list" class="template-list"></div>
      </section>

      <form id="invitation-form" class="editor-form">
        <details class="editor-group" data-editor-group="style" open>
          <summary><span>스타일과 효과</span><small>인트로 · 파티클 · 폰트</small></summary>
          <div class="editor-group-body">
            <div class="full intro-effect-field">
              <label for="intro-effect"><span>인트로 효과</span></label>
              <select id="intro-effect" name="introEffect" aria-label="인트로 효과">
                <option value="none">사용 안 함</option>
                <optgroup label="클래식"><option value="envelope">봉투 열기</option><option value="card-shrink">전체 화면 카드</option></optgroup>
                <optgroup label="시네마틱"><option value="dawn">어둠에서 밝아지기</option><option value="curtain">커튼 열기</option><option value="spotlight">스포트라이트</option></optgroup>
                <optgroup label="축하"><option value="fireworks">골드 폭죽</option></optgroup>
                <optgroup label="로맨틱"><option value="petals">꽃잎 사이로</option></optgroup>
                <optgroup label="사진"><option value="photo-focus">사진 초점 전환</option></optgroup>
              </select>
              <button id="replay-intro-button" class="replay-intro-button" type="button" title="인트로 다시 보기" aria-label="인트로 다시 보기" disabled>&#8635;</button>
            </div>
            <label class="full effect-field">
              <span>파티클 효과</span>
              <select name="particleEffect" aria-label="파티클 효과">
                <option value="none">효과 없음</option>
                <optgroup label="로맨틱"><option value="petals">꽃잎</option><option value="hearts">하트</option></optgroup>
                <optgroup label="분위기"><option value="sparkle">빛가루</option><option value="fireflies">반딧불</option><option value="bubbles">버블</option></optgroup>
                <optgroup label="계절"><option value="snow">눈</option><option value="leaves">나뭇잎</option></optgroup>
                <optgroup label="축하"><option value="confetti">컨페티</option></optgroup>
              </select>
            </label>
            <label class="range-field">
              <span class="range-heading"><span>파티클 크기</span><output data-particle-scale-output for="particle-scale">100%</output></span>
              <input id="particle-scale" name="particleScale" type="range" min="50" max="200" step="5" value="100" aria-label="파티클 크기 스케일">
            </label>
            <label class="range-field">
              <span class="range-heading"><span>파티클 양</span><output data-particle-amount-output for="particle-amount">100%</output></span>
              <input id="particle-amount" name="particleAmount" type="range" min="25" max="500" step="25" value="100" aria-label="파티클 양 스케일">
            </label>
            <label>
              <span>영문 폰트</span>
              <select name="englishFont" aria-label="영문 폰트">
                <option value="cormorant-garamond">Cormorant Garamond</option><option value="playfair-display">Playfair Display</option><option value="dm-serif-display">DM Serif Display</option><option value="libre-baskerville">Libre Baskerville</option><option value="great-vibes">Great Vibes</option>
              </select>
            </label>
            <label>
              <span>한글 폰트</span>
              <select name="koreanFont" aria-label="한글 폰트">
                <option value="gowun-batang">고운바탕</option><option value="noto-serif-kr">노토 명조</option><option value="nanum-myeongjo">나눔명조</option><option value="nanum-gothic">나눔고딕</option><option value="song-myung">송명</option><option value="gmarket-sans">Gmarket Sans</option>
              </select>
            </label>
          </div>
        </details>

        <details class="editor-group" data-editor-group="details" open>
          <summary><span>기본 정보</span><small>제목 · 일정 · 메시지</small></summary>
          <div class="editor-group-body">
            <label><span>제목</span><input name="title" type="text" autocomplete="off"></label>
            <label><span>부제</span><input name="subtitle" type="text" autocomplete="off"></label>
            <label><span>일시</span><input name="dateLabel" type="text" autocomplete="off"></label>
            <label><span>보내는 사람</span><input name="host" type="text" autocomplete="off"></label>
            <label class="full"><span>메시지</span><textarea name="message" rows="4"></textarea></label>
          </div>
        </details>

        <details class="editor-group" data-editor-group="location" open>
          <summary><span>대표 장소</span><small>장소 · 네이버 지도</small></summary>
          <div class="editor-group-body">
            <label><span>장소 또는 주소</span><input name="location" type="text" autocomplete="off"></label>
            <label><span>지도 링크</span><input name="mapUrl" type="url" autocomplete="off"></label>
            <label class="full checkbox-field"><input name="mapEnabled" type="checkbox"><span>대표 동적 지도 표시</span></label>
            <div class="full map-settings" data-map-settings hidden>
              <input name="mapLatitude" type="hidden">
              <input name="mapLongitude" type="hidden">
              <input name="mapZoom" type="hidden" value="16">
              <small class="map-message" data-map-message role="status" aria-live="polite"></small>
            </div>
          </div>
        </details>

        <details class="editor-group" data-editor-group="content" open>
          <summary><span>코스와 사진</span><small>드래그해서 순서 변경</small></summary>
          <div class="editor-group-body editor-content-body">
            <section class="full content-editor-section" aria-label="초대장 항목">
              <header class="content-editor-header">
                <div class="content-editor-commands">
                  <button id="add-course-button" class="add-item-button" type="button">+ 코스</button>
                  <button id="add-photo-button" class="add-item-button" type="button">+ 사진</button>
                  <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
                </div>
              </header>
              <div id="content-editor" class="content-editor"></div>
            </section>
          </div>
        </details>
      </form>

      <div class="action-row">
        <button id="download-button" class="primary-button" type="button">HTML 다운로드</button>
        <button id="save-button" class="secondary-button" type="button">목록에 등록</button>
      </div>
      <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
    </section>

    <section class="preview-panel">
      <header class="panel-title">
        <p class="eyebrow">Preview</p>
        <h2>미리보기</h2>
      </header>
      <div id="preview" class="preview-frame"></div>
    </section>

    <section class="library-panel">
      <header class="panel-title">
        <p class="eyebrow">Library</p>
        <h2>등록된 초대장</h2>
      </header>
      <div class="upload-box">
        <label for="html-upload">다운로드된 HTML 등록</label>
        <input id="html-upload" type="file" accept=".html,text/html">
        <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </section>
  </main>

  <script src="assets/intro-effects.js"></script>
  <script src="assets/template-catalog.js"></script>
  <script src="assets/invitation-core.js"></script>
  <script src="assets/image-tools.js"></script>
  <script src="assets/content-order.js"></script>
  <script src="assets/invitation-storage.js"></script>
  <script src="assets/map-location.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
