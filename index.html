<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#42101f">
  <meta name="description" content="템플릿 기반 초대장 제작 및 HTML 다운로드 도구">
  <title>Invitation Maker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='46'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Serif+Display&family=Gowun+Batang:wght@400;700&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Song+Myung&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-mobile-view="editor">
  <nav class="mobile-view-tabs" aria-label="화면 전환">
    <button type="button" data-mobile-view="editor" aria-pressed="true">제작</button>
    <button type="button" data-mobile-view="preview" aria-pressed="false">미리보기</button>
    <button type="button" data-mobile-view="library" aria-pressed="false">보관함</button>
  </nav>
  <main class="app-shell">
    <section class="maker-panel">
      <header class="maker-header">
        <p class="eyebrow">Invitation Maker</p>
        <h1>초대장 제작기</h1>
        <p>템플릿을 고르고 내용을 입력하면, 독립 실행 가능한 초대장 HTML을 다운로드할 수 있습니다.</p>
      </header>

      <section class="template-picker" aria-label="초대장 템플릿 선택">
        <span class="picker-label">Template</span>
        <div id="template-list" class="template-list"></div>
      </section>

      <form id="invitation-form" class="editor-form">
        <label class="full effect-field">
          <span>파티클 효과</span>
          <select name="particleEffect" aria-label="파티클 효과">
            <option value="none">효과 없음</option>
            <option value="sparkle">은은한 빛가루</option>
            <option value="petals">꽃잎</option>
            <option value="confetti">컨페티</option>
          </select>
        </label>
        <label class="range-field">
          <span class="range-heading">
            <span>파티클 크기</span>
            <output data-particle-scale-output for="particle-scale">100%</output>
          </span>
          <input id="particle-scale" name="particleScale" type="range" min="50" max="200" step="5" value="100" aria-label="파티클 크기 스케일">
        </label>
        <label class="range-field">
          <span class="range-heading">
            <span>파티클 양</span>
            <output data-particle-amount-output for="particle-amount">100%</output>
          </span>
          <input id="particle-amount" name="particleAmount" type="range" min="25" max="200" step="25" value="100" aria-label="파티클 양 스케일">
        </label>
        <label>
          <span>영문 폰트</span>
          <select name="englishFont" aria-label="영문 폰트">
            <option value="cormorant-garamond">Cormorant Garamond</option>
            <option value="playfair-display">Playfair Display</option>
            <option value="dm-serif-display">DM Serif Display</option>
            <option value="libre-baskerville">Libre Baskerville</option>
            <option value="great-vibes">Great Vibes</option>
          </select>
        </label>
        <label>
          <span>한글 폰트</span>
          <select name="koreanFont" aria-label="한글 폰트">
            <option value="gowun-batang">고운바탕</option>
            <option value="noto-serif-kr">노토 명조</option>
            <option value="nanum-myeongjo">나눔명조</option>
            <option value="nanum-gothic">나눔고딕</option>
            <option value="song-myung">송명</option>
            <option value="gmarket-sans">Gmarket Sans</option>
          </select>
        </label>
        <label>
          <span>제목</span>
          <input name="title" type="text" autocomplete="off">
        </label>
        <label>
          <span>부제</span>
          <input name="subtitle" type="text" autocomplete="off">
        </label>
        <label>
          <span>일시</span>
          <input name="dateLabel" type="text" autocomplete="off">
        </label>
        <label>
          <span>보내는 사람</span>
          <input name="host" type="text" autocomplete="off">
        </label>
        <label>
          <span>대표 장소</span>
          <input name="location" type="text" autocomplete="off">
        </label>
        <label>
          <span>대표 지도 링크</span>
          <input name="mapUrl" type="url" autocomplete="off">
        </label>
        <label class="full checkbox-field">
          <input name="mapEnabled" type="checkbox">
          <span>대표 동적 지도 표시</span>
        </label>
        <div class="full map-settings" data-map-settings hidden>
          <label>
            <span>위도</span>
            <input name="mapLatitude" type="number" min="-90" max="90" step="any" inputmode="decimal">
          </label>
          <label>
            <span>경도</span>
            <input name="mapLongitude" type="number" min="-180" max="180" step="any" inputmode="decimal">
          </label>
          <label>
            <span>지도 줌</span>
            <input name="mapZoom" type="number" min="6" max="21" step="1" inputmode="numeric">
          </label>
          <small class="full map-message" data-map-message role="status" aria-live="polite" hidden></small>
        </div>
        <label class="full">
          <span>메시지</span>
          <textarea name="message" rows="4"></textarea>
        </label>
        <section class="full stops-editor-section" aria-labelledby="stops-editor-title">
          <header class="stops-editor-header">
            <span id="stops-editor-title">데이트 코스</span>
            <button id="add-stop-button" class="add-stop-button" type="button">+ 코스 추가</button>
          </header>
          <div id="stops-editor" class="stops-editor"></div>
        </section>
      </form>

      <div class="action-row">
        <button id="download-button" class="primary-button" type="button">HTML 다운로드</button>
        <button id="save-button" class="secondary-button" type="button">목록에 등록</button>
      </div>
      <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
    </section>

    <section class="preview-panel">
      <header class="panel-title">
        <p class="eyebrow">Preview</p>
        <h2>미리보기</h2>
      </header>
      <div id="preview" class="preview-frame"></div>
    </section>

    <section class="library-panel">
      <header class="panel-title">
        <p class="eyebrow">Library</p>
        <h2>등록된 초대장</h2>
      </header>
      <div class="upload-box">
        <label for="html-upload">다운로드된 HTML 등록</label>
        <input id="html-upload" type="file" accept=".html,text/html">
        <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </section>
  </main>

  <script src="assets/invitation-core.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
