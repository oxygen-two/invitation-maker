name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite does all its date work in UTC internally, but nothing enforced
    # that until now: a runner in another zone would have been the first place
    # a leaked local-time assumption surfaced. UTC is the pinned baseline and
    # the second leg exists to fail when the suite stops being zone-independent.
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package.json requires >=22, so verify against that floor rather than
      # whatever newer runtime happens to be installed locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build:public

      # Generators whose output is committed. Both are pure node:fs — no
      # browser — so they can regenerate in memory and compare here rather
      # than letting a stale artifact ship. build-error-pages writes the 11
      # standalone error pages; build-template-art writes the two art modules.
      - name: Check the generated error pages are in sync
        run: node scripts/build-error-pages.cjs --check

      - name: Check the generated template art is in sync
        run: node scripts/build-template-art.js --check

      # build:public writes into the ignored public/ directory. If it ever
      # touches a tracked file instead, fail here rather than in a deploy.
      - name: Verify the build left tracked files unchanged
        run: git diff --exit-code

      - name: Check the diff for whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

  # The unit suite drives the publication store through fakes. This job is the
  # only place the real Mongo queries, quota counters, and TTL indexes run.
  publishing-mongo:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The script refuses non-loopback hosts because it drops its database
      # when it finishes. The service container is reachable on 127.0.0.1.
      - run: npm run verify:publishing-mongo
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017

      # Three tests in publishing-server.test.js skip themselves unless
      # MONGODB_URI is set, and the verify job never sets it. Running the
      # suite again here is the only place they execute: this is where Mongo
      # exists. verify:publishing-mongo above is a standalone assert script,
      # not a `node --test` run, so it cannot stand in for them.
      - run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          TZ: UTC
