name: Report a synthetic monitoring result
description: >-
  Opens, updates, or closes a single tracking issue for one synthetic suite.
  A red tab nobody opens is not an alert; an issue is, and it costs nothing.

inputs:
  report-path:
    description: Markdown report written by the monitor. Its first line carries the signature comment.
    required: true
  outcome:
    description: success or failure
    required: true
  label:
    description: Label that identifies this suite's tracking issue. Created if missing.
    required: true
  issue-title:
    description: Title of the tracking issue. Kept stable so the same issue is reused.
    required: true
  github-token:
    description: Token with issues:write.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ inputs.report-path }}
        OUTCOME: ${{ inputs.outcome }}
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.issue-title }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        # Created up front so `gh issue list --label` below never fails on a
        # label that does not exist yet, which is the state of a fresh clone.
        gh label create "$LABEL" --color B60205 --description "Automated production monitoring" >/dev/null 2>&1 || true

        signature_of() { sed -n '1s/.*synthetic-signature: \(.*\) -->.*/\1/p' "$1"; }

        # A monitor that died before writing its report is itself a failure
        # worth an issue, so synthesise a body rather than letting this step
        # explode and leave nobody told.
        if [ ! -f "$REPORT" ]; then
          missing="$REPORT"
          REPORT="$(mktemp)"
          {
            echo "<!-- synthetic-signature: monitor-produced-no-report -->"
            echo "## The monitor did not produce a report"
            echo
            echo "The check script exited without writing \`$missing\`. Read the run log:"
            echo "this usually means the script itself crashed, not that production is down."
          } > "$REPORT"
        fi

        number="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"

        if [ "$OUTCOME" = "success" ]; then
          # Close the loop as loudly as it was opened, so an open issue always
          # means "production is broken right now" rather than "was, once".
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Recovered: all checks passed in [this run]($RUN_URL). Closing."
            gh issue close "$number"
            echo "Closed #$number after a clean run."
          else
            echo "All checks passed and no incident issue was open."
          fi
          exit 0
        fi

        body="$(mktemp)"
        { cat "$REPORT"; printf '\n\nProduced by [this run](%s).\n' "$RUN_URL"; } > "$body"

        if [ -z "$number" ]; then
          gh issue create --title "$TITLE" --label "$LABEL" --body-file "$body"
          exit 0
        fi

        # An incident is already open. Refresh the body so it always shows the
        # latest detail, but comment ONLY when the set of failing checks has
        # changed. A comment every run is how people learn to mute a repository,
        # and a muted alert is worse than no alert.
        previous="$(mktemp)"
        gh issue view "$number" --json body --jq .body > "$previous"
        if [ "$(signature_of "$previous")" != "$(signature_of "$REPORT")" ]; then
          gh issue comment "$number" --body "The set of failing checks changed. See the updated issue body, from [this run]($RUN_URL)."
        else
          echo "Same failures as the last run; updating #$number in place without commenting."
        fi
        gh issue edit "$number" --body-file "$body"
