<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f7f4">
  <title>초대장</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --paper: #f7f7f4; --ink: #282b29; --green: #314e41; --muted: #59645e; --line: #dce1d8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }
    .skip { position: absolute; left: 20px; top: -80px; background: #fff; padding: 10px; z-index: 5; }
    .skip:focus { top: 10px; }
    [hidden] { display: none !important; }

    /* Shared header/footer chrome — only shown when the invitation cannot be
       displayed, so it matches the standalone error pages (see 404.html /
       scripts/build-error-pages.cjs) without shrinking a successfully loaded
       invitation's iframe. */
    .site-header, .site-footer {
      width: min(1200px, 100%);
      margin-inline: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 24px 32px;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -.6px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; gap: 10px; }
    .brand svg { width: 23px; height: 23px; }
    .header-note, .footer-note { font-size: 12px; color: var(--muted); }
    .site-footer { border-top: 1px solid var(--line); font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-top: auto; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .footer-note { letter-spacing: 0; }

    main { flex: 1; display: flex; flex-direction: column; }
    #shared-invitation-status { margin: 0; padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
    #shared-invitation-status:empty { display: none; }
    #shared-invitation-frame { display: block; width: 100%; min-height: 100vh; border: 0; background: var(--paper); }
    #shared-invitation-frame[hidden] { display: none; }

    /* Not-found / revoked / failed state — same voice and palette as the
       generated error pages, laid out as a single centered column since this
       page never carries the two-column marketing layout those pages use. */
    .error-panel { width: min(480px, calc(100% - 48px)); margin: auto; padding: 32px 0 56px; text-align: center; }
    .art { position: relative; width: 168px; aspect-ratio: 1; margin: 0 auto 28px; display: grid; place-items: center; }
    .halo { position: absolute; inset: 3%; border-radius: 50%; background: #e9eee6; border: 1px solid #e0e6dc; }
    .halo::after { content: ""; position: absolute; inset: 19px; border: 1px dashed #b7c3b5; border-radius: 50%; }
    .envelope { position: relative; width: 82%; transform: rotate(-8deg); filter: drop-shadow(0 22px 22px #283d3217); }
    .envelope svg { display: block; width: 100%; height: auto; }
    .seal { position: absolute; right: 4%; bottom: 12%; border-radius: 50%; background: var(--green); color: #fff; width: 44px; height: 44px; display: grid; place-items: center; font-size: 18px; border: 4px solid var(--paper); }
    .eyebrow { font-size: 10px; letter-spacing: 1.8px; font-weight: 700; color: var(--green); text-transform: uppercase; margin: 0 0 12px; }
    .error-panel h1 { font-size: clamp(21px, 5vw, 25px); line-height: 1.45; letter-spacing: -.5px; word-break: keep-all; margin: 0 0 14px; }
    .error-panel .description { color: var(--muted); font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; margin: 0 0 26px; }
    .actions { display: flex; justify-content: center; margin: 0 0 26px; }
    .actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 9px; padding: 11px 22px; font: inherit; font-size: 14px; font-weight: 650; text-decoration: none; background: var(--green); color: #fff; }
    .actions a:hover { box-shadow: 0 0 0 2px #314e4125; }
    .hint { border-top: 1px solid var(--line); margin: 0; padding-top: 18px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <a class="skip" href="#shared-invitation-root">본문으로 건너뛰기</a>
  <header id="shared-invitation-header" class="site-header" hidden>
    <a class="brand" href="/" aria-label="Invitation Studio 홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>Invitation Studio</a>
    <span class="header-note">마음을 전하는 작은 시작</span>
  </header>
  <main id="shared-invitation-root">
    <p id="shared-invitation-status" role="status" aria-live="polite">초대장을 불러오는 중입니다.</p>
    <iframe id="shared-invitation-frame" title="공개 초대장" hidden></iframe>
    <section id="shared-invitation-error" class="error-panel" hidden aria-labelledby="shared-invitation-error-title">
      <div class="art" aria-hidden="true">
        <div class="halo"></div>
        <div class="envelope"><svg viewBox="0 0 360 330" fill="none"><path d="M24 144 180 32l156 112v153H24Z" fill="#c6d1c1"/><rect x="61" y="62" width="238" height="222" rx="5" fill="#fffdf8" stroke="#d8ded1"/><rect x="75" y="76" width="210" height="194" rx="2" stroke="#e3e5da"/><path d="M180 153c-42-24-26-51-10-35l10 10 10-10c16-16 32 11-10 35Z" fill="#7e957b"/><path d="M133 180h94M152 195h56" stroke="#b6c1ad" stroke-width="2" stroke-linecap="round"/><path d="m24 144 156 96 156-96v153H24Z" fill="#d9e1d1" stroke="#b7c5b2"/><path d="m24 297 134-97c13-10 31-10 44 0l134 97" fill="#e5eadf" stroke="#b7c5b2"/></svg></div>
        <span class="seal">✳</span>
      </div>
      <p class="eyebrow" id="shared-invitation-error-eyebrow"></p>
      <h1 id="shared-invitation-error-title"></h1>
      <p class="description" id="shared-invitation-error-description"></p>
      <div class="actions"><a href="/">스튜디오로 돌아가기 <span aria-hidden="true">&nbsp;↗</span></a></div>
      <p class="hint" id="shared-invitation-error-hint"></p>
    </section>
  </main>
  <footer id="shared-invitation-footer" class="site-footer" hidden>
    <span>INVITATION STUDIO</span><span class="footer-note">작은 초대, 소중한 순간.</span>
  </footer>
  <script src="/assets/analytics/config.js"></script>
  <script type="module" src="/assets/analytics/ga4.js"></script>
  <script src="/assets/invitation/intro-effects.js"></script>
  <script src="/assets/invitation/template-catalog.js"></script>
  <script src="/assets/invitation/template-art.js"></script>
  <script src="/assets/invitation/template-renderers.js"></script>
  <script src="/assets/media/hero-image.js"></script>
  <script src="/assets/invitation/core.js"></script>
  <script src="/assets/publishing/shared-invitation.js"></script>
</body>
</html>
