<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#42101f">
  <title>초대장 열기</title>
  <style>
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: #2a1720; background: #f3e7e1; font-family: system-ui, sans-serif; }
    main { width: min(420px, 100%); padding: 24px; border: 1px solid rgba(101, 58, 65, .16); border-radius: 8px; background: #fffdf9; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; color: #65535a; font-size: 14px; }
    a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 20px; padding: 0 16px; color: #fffaf2; border-radius: 8px; background: #5d182c; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>초대장을 불러오는 중입니다.</h1>
    <p>잠시만 기다려 주세요.</p>
  </main>
  <script src="assets/invitation-core.js" defer></script>
  <script src="assets/invitation-storage.js" defer></script>
  <script src="assets/viewer.js" defer></script>
</body>
</html>
