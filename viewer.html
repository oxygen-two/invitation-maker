<!doctype html>
<!-- lang is the served default; assets/i18n/i18n.js rewrites it to the
     language the AUTHOR resolves to. This page only ever shows an author their
     own saved invitation on their own device, so its chrome follows the studio
     language they chose next door. The invitation it rebuilds keeps whatever
     language was baked into the saved file — see assets/invitation/viewer.js. -->
<html lang="ko" data-i18n-title="viewer.documentTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#42101f">
  <meta name="theme-color" content="#15181a" media="(prefers-color-scheme: dark)">
  <title>초대장 열기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='46'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3e7e1;
      --card: #fffdf9;
      --card-border: rgba(101, 58, 65, .16);
      --ink: #2a1720;
      --muted: #65535a;
      --footer-muted: #8a6f78;
      --accent: #5d182c;
      --accent-ink: #fffaf2;
    }
    /* B-12: dark mode for this loading card. This page only ever shows an
       author their own device's saved invitation, so it keeps its own
       rose/wine identity rather than the green site chrome — but the same
       "dark surface with a slightly lighter card" shape as the rest of the
       site. System preference first, `[data-theme]` ready for a future
       manual toggle. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper: #15181a;
        --card: #1f1719;
        --card-border: rgba(255, 255, 255, .14);
        --ink: #f4ece9;
        --muted: #c9adb2;
        --footer-muted: #a99195;
        /* Lightened so it still reads as an accent on a dark card instead of
           near-black; the button text flips to a dark ink to stay legible. */
        --accent: #e2a4b0;
        --accent-ink: #3a141d;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #15181a;
      --card: #1f1719;
      --card-border: rgba(255, 255, 255, .14);
      --ink: #f4ece9;
      --muted: #c9adb2;
      --footer-muted: #a99195;
      --accent: #e2a4b0;
      --accent-ink: #3a141d;
    }
    * { box-sizing: border-box; }
    /* The bottom pad carries --consent-height, which consent.js measures onto
       <html> while the consent banner is open and removes when it closes. */
    body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; margin: 0; padding: 24px; padding-bottom: calc(24px + var(--consent-height, 0px)); color: var(--ink); background: var(--paper); font-family: system-ui, sans-serif; }
    main { width: min(420px, 100%); margin: auto; padding: 24px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--card); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 20px; padding: 0 16px; color: var(--accent-ink); border-radius: 8px; background: var(--accent); font-weight: 700; text-decoration: none; }
    footer { flex: 0 0 auto; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); text-align: center; color: var(--footer-muted); font-size: 11px; letter-spacing: 1px; }
    footer .footer-note { letter-spacing: 0; }
  </style>
  <!-- In <head> and before the body: this page replaces its own document the
       moment the invitation is ready, so the loading copy has to be right on
       the first paint rather than after a later pass. -->
  <script src="assets/i18n/i18n.js"></script>
  <script src="assets/i18n/dictionary-ko.js"></script>
  <script src="assets/i18n/dictionary-en.js"></script>
  <script>InvitationI18n.init();</script>
</head>
<body>
  <main>
    <h1 data-i18n="viewer.loadingTitle">초대장을 불러오는 중입니다.</h1>
    <p data-i18n="viewer.loadingBody">잠시만 기다려 주세요.</p>
  </main>
  <footer><span>INVITATION STUDIO</span> <span class="footer-note" data-i18n="viewer.footerNote">작은 초대, 소중한 순간.</span></footer>
  <!-- Not deferred, and ahead of the deferred bundle below: the handlers have
       to exist before the files they watch are parsed. -->
  <script src="assets/analytics/config.js"></script>
  <script src="assets/analytics/analytics.js"></script>
  <script src="assets/analytics/error-reporting.js"></script>
  <script src="assets/site/consent.js"></script>
  <script src="assets/invitation/intro-effects.js" defer></script>
  <script src="assets/invitation/template-catalog.js" defer></script>
  <script src="assets/invitation/template-art-index.js" defer></script>
  <script src="assets/invitation/template-renderers.js" defer></script>
  <script src="assets/media/hero-image.js" defer></script>
  <script src="assets/invitation/core.js" defer></script>
  <script src="assets/storage/invitation-storage.js" defer></script>
  <script src="assets/invitation/viewer.js" defer></script>
</body>
</html>
