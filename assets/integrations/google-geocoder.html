<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Google geocoder</title>
  <!--
    Address lookup for the studio when an invitation uses Google Maps.

    Why a separate sandboxed page (all observed in Chrome with a correctly
    referrer-restricted key):
    - Google Maps caches authorization data in localStorage. The studio preview
      is an about:srcdoc frame whose location origin reads "null". If a copy of
      Google Maps with a real URL writes that cache first, the preview's copy
      reuses it and fails with RefererNotAllowedMapError ("site URL: null").
    - The geocoder inside the srcdoc preview itself never answers.
    This page has a real URL, which the geocoder accepts, and runs in a sandbox
    without allow-same-origin, so it cannot read or write the studio's storage.

    Protocol: the parent posts {type: "geocode", id, address, key, language};
    this page answers {type: "geocode-result", id, status, latitude, longitude}.
    Only coordinates leave this page.
  -->
</head>
<body>
<script>
(() => {
  let mapsPromise;
  const loadMaps = (key, language) => {
    if (mapsPromise) return mapsPromise;
    mapsPromise = new Promise((resolve, reject) => {
      window.__geocoderMapsReady = () => resolve(window.google.maps);
      const script = document.createElement("script");
      script.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key)
        + "&loading=async&callback=__geocoderMapsReady&language=" + encodeURIComponent(language || "ko");
      script.async = true;
      script.onerror = () => { mapsPromise = undefined; reject(new Error("load failed")); };
      document.head.append(script);
    });
    return mapsPromise;
  };

  const reply = (message) => window.parent.postMessage({ type: "geocode-result", ...message }, "*");

  window.addEventListener("message", async (event) => {
    if (event.source !== window.parent) return;
    const data = event.data || {};
    if (data.type !== "geocode" || typeof data.id !== "string" || typeof data.address !== "string"
      || !/^[A-Za-z0-9_-]+$/.test(String(data.key || ""))) return;
    try {
      const maps = await loadMaps(data.key, data.language);
      const { Geocoder } = await maps.importLibrary("geocoding");
      new Geocoder().geocode({ address: data.address }, (results, status) => {
        const location = results && results[0] && results[0].geometry && results[0].geometry.location;
        reply({
          id: data.id,
          status: String(status),
          latitude: location ? location.lat() : null,
          longitude: location ? location.lng() : null
        });
      });
    } catch (error) {
      reply({ id: data.id, status: "UNKNOWN_ERROR", latitude: null, longitude: null });
    }
  });
})();
</script>
</body>
</html>
